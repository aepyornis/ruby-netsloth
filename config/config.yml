iperf3_host: 'speedtest.calyx.dev'

ooni_cmd: '/usr/local/bin/miniooni'

# this is the time limit for tests using fast.com
netflix_run_seconds: 12

# influxdb_host:
# influxdb_token:

measurements:
# - iperf3?iperf3_host=iperf.webdev1.calyx.dev
 - ooni.dash
 - ooni.ndt
 - netflix
