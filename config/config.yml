gather_interval_seconds: 120
org: 'calyx'
bucket: 'netsloth'
user: 'unknown'
location: 'unknown'
device: 'unknown'

allowed_devices:
 - mifi-m2000
 - franklin-t10
 - quanta-5g
 - mifi-x
 - office-wifi
 - jextream
 - peplink-max-br1-mini
 - mikrotik-chateau
 - winegard-connect
 - glinet-puli
 - glinet-spitz-ax

iperf3_cmd: '/usr/bin/iperf3'
iperf3_port: '5201'
